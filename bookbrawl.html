:root{
  --bg:#efe7d6; --surface:#e5dac2; --text:#2b211a; --muted:#6e604f;
  --rule:#c6b696; --accent:#7a2630; --brass:#8a6a35;
  --display:"Engravers Old English", "UnifrakturMaguntia", "Old English Text MT", serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17120f; --surface:#211913; --text:#e8dcc4; --muted:#a3947d;
    --rule:#3b2f25; --accent:#b24a55; --brass:#b8955c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17120f; --surface:#211913; --text:#e8dcc4; --muted:#a3947d;
  --rule:#3b2f25; --accent:#b24a55; --brass:#b8955c;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"IM Fell English", "Iowan Old Style", Georgia, serif;
  font-size:1.2rem; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:76rem; margin:0 auto; padding:3rem 3rem 5rem}
.display{font-family:var(--display); font-weight:400}
.sc{font-family:"IM Fell English SC", "IM Fell English", Georgia, serif}

/* Masthead: title left, tabs right, one rule beneath */
header{display:flex; align-items:flex-end; justify-content:space-between; gap:2rem; padding-bottom:1rem; border-bottom:1px solid var(--rule); position:relative}
header::after{content:""; position:absolute; left:0; right:0; bottom:-5px; border-bottom:1px solid var(--rule)}
h1{font-size:clamp(3.25rem, 6.5vw, 5.5rem); line-height:.95; margin:0}

nav{display:flex; gap:2.25rem; padding-bottom:.35rem}
nav button{
  font:inherit; font-family:"IM Fell English SC", Georgia, serif; font-size:1.3rem;
  background:none; border:0; padding:.25rem 0; color:var(--muted); cursor:pointer;
  border-bottom:2px solid transparent;
}
nav button:hover{color:var(--text)}
nav button[aria-selected="true"]{color:var(--text); border-bottom-color:var(--accent)}
button:focus-visible{outline:2px solid var(--brass); outline-offset:4px}

main{margin-top:2.75rem}
h2{font-family:var(--display); font-weight:400; font-size:2.1rem; line-height:1.1; margin:0 0 1rem}

/* Ranking rows: rank, name, a long bar as the graphic, points */
ol.roll{list-style:none; margin:0; padding:0}
.row{
  display:grid; grid-template-columns:3.5rem minmax(13rem, 1fr) minmax(0, 2.4fr) 5.5rem;
  column-gap:1.5rem; align-items:center; padding:.85rem 0; border-bottom:1px solid var(--rule);
}
.rank{font-size:1.15rem; color:var(--muted)}
.name{min-width:0; overflow-wrap:anywhere; line-height:1.25}
.cls{display:block; font-family:"IM Fell English", Georgia, serif; font-style:italic; color:var(--muted); font-size:.95rem}
.track{height:4px; background:var(--rule); position:relative}
.bar{position:absolute; inset:0; background:var(--brass); transform-origin:left; transition:transform .6s ease}
.pts{font-variant-numeric:oldstyle-nums tabular-nums; font-size:1.35rem; text-align:right; white-space:nowrap}
.row.first .rank{color:var(--accent)}
.row.first .bar{background:var(--accent)}
.row.first .name{font-family:var(--display); font-size:1.9rem}

/* By class: every class side by side */
.columns{display:grid; grid-template-columns:repeat(auto-fit, minmax(19rem, 1fr)); gap:2.5rem 3rem}
.columns .row{grid-template-columns:2.5rem 1fr 4.5rem; row-gap:.5rem}
.columns .rank{grid-column:1; grid-row:1}
.columns .name{grid-column:2; grid-row:1}
.columns .pts{grid-column:3; grid-row:1}
.columns .track{grid-column:2 / -1; grid-row:2; height:3px}
.columns .row.first .name{font-size:1.45rem}

.colhead{color:var(--muted); font-style:italic; font-size:1rem; text-align:right; padding-bottom:.35rem; border-bottom:1px solid var(--rule)}
.empty{color:var(--muted); font-style:italic; margin:0}

/* Desktop: fill the whole screen; rows share the height evenly and type scales with it */
@media (min-width: 761px) and (min-height: 520px){
  html, body{height:100%}
  .wrap{max-width:none; min-height:100%; display:flex; flex-direction:column; padding:3.5vh 4vw 3vh}
  header{gap:3vw; padding-bottom:1.6vh}
  h1{font-size:clamp(3.5rem, 9.5vh, 9rem)}
  nav{gap:3vw}
  nav button{font-size:clamp(1.3rem, 2.7vh, 2.3rem)}
  main{flex:1; min-height:0; margin-top:3.5vh; display:flex; flex-direction:column}
  main > ol.roll{flex:1}
  ol.roll{display:grid; grid-template-rows:repeat(var(--n, 1), minmax(3.25rem, 1fr))}
  .row{padding:0; column-gap:2vw; grid-template-columns:5vw minmax(16rem, 1.1fr) minmax(0, 2.6fr) 8vw}
  .rank{font-size:clamp(1.15rem, 2.7vh, 2.3rem)}
  .name{font-size:clamp(1.2rem, 3vh, 2.7rem)}
  .cls{font-size:clamp(.95rem, 1.9vh, 1.6rem); margin-top:.2vh}
  .pts{font-size:clamp(1.35rem, 3.6vh, 3.2rem)}
  .track{height:clamp(4px, 1vh, 12px)}
  .row.first .name{font-size:clamp(1.9rem, 5vh, 4.5rem)}
  .colhead{font-size:clamp(1rem, 2vh, 1.7rem); padding-bottom:.8vh}

  .columns{flex:1; min-height:0; gap:3vh 4vw; grid-template-columns:repeat(var(--cols, 2), minmax(0, 1fr))}
  .columns section{display:flex; flex-direction:column; min-height:0}
  .columns h2{font-size:clamp(2rem, 4.8vh, 4rem); margin-bottom:1.5vh}
  .columns ol.roll{flex:1}
  .columns .row{grid-template-columns:3.5vw 1fr 6vw; align-content:center; row-gap:1vh}
  .columns .track{height:clamp(3px, .8vh, 10px)}
  .columns .row.first .name{font-size:clamp(1.45rem, 3.6vh, 3.2rem)}
}

/* Smaller screens still work */
@media (max-width: 760px){
  .wrap{padding:2rem 1.25rem 4rem}
  header{flex-direction:column; align-items:flex-start; gap:1.25rem}
  nav{gap:1.5rem; flex-wrap:wrap}
  nav button{font-size:1.1rem}
  .row{grid-template-columns:2.5rem 1fr auto; row-gap:.5rem}
  .row .rank{grid-column:1; grid-row:1}
  .row .name{grid-column:2; grid-row:1}
  .row .pts{grid-column:3; grid-row:1}
  .row .track{grid-column:2 / -1; grid-row:2}
  .row.first .name{font-size:1.5rem}
}
@media (prefers-reduced-motion: reduce){ .bar{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="display">Book Brawl</h1>
    <nav role="tablist" aria-label="Rankings">
      <button role="tab" data-view="teams" aria-selected="true">All teams</button>
      <button role="tab" data-view="classes" aria-selected="false">Classes</button>
      <button role="tab" data-view="by-class" aria-selected="false">By class</button>
    </nav>
  </header>
  <main id="board" role="tabpanel"><p class="empty">Opening the ledger…</p></main>
</div>
<script>
// The Apps Script web app URL (ends in /exec).
const API_URL = "https://script.google.com/macros/s/AKfycbxKuI0yYHNqzq0qeE10dsX8ZgrUPPT8JSd6blBFYJ3CzStefBmMoa1uJ7IRzzPhFxgy/exec";

(() => {
  const VIEWS = ["teams", "classes", "by-class"];
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const fmt = (n) => String(Math.round(n * 100) / 100);
  const classLabel = (p) => /^\d/.test(p) ? p + " Period" : p;
  const classOrder = (a, b) => (parseInt(a) || 99) - (parseInt(b) || 99) || a.localeCompare(b);
  const roman = (n) => { if (n >= 40) return String(n); const m = [[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]]; let s = ""; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; };

  let standings = null, lastJson = "";
  let view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "teams";

  function rankRows(items, key) {
    const sorted = [...items].sort((a, b) => b[key] - a[key] || a.name.localeCompare(b.name));
    let rank = 0, prev = null;
    return sorted.map((it, i) => { if (it[key] !== prev) { rank = i + 1; prev = it[key]; } return { ...it, rank }; });
  }

  function roll(items, key, sub) {
    const ol = el("ol", "roll");
    ol.style.setProperty("--n", Math.max(items.length, 1));
    const max = Math.max(...items.map((i) => i[key]), 0);
    for (const it of rankRows(items, key)) {
      const li = el("li", "row" + (it.rank === 1 && it[key] > 0 ? " first" : ""));
      const nm = el("span", "name", it.name);
      const s = sub && sub(it); if (s) nm.append(el("span", "cls", s));
      const track = el("span", "track"); const bar = el("span", "bar");
      bar.style.transform = "scaleX(" + (max > 0 ? it[key] / max : 0) + ")";
      track.append(bar);
      const p = el("span", "pts", fmt(it[key])); p.setAttribute("aria-label", fmt(it[key]) + " points");
      li.append(el("span", "rank sc", roman(it.rank)), nm, track, p);
      ol.append(li);
    }
    return ol;
  }

  function render() {
    document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === view)));
    const main = $("#board");
    main.replaceChildren();
    if (!standings) return;
    const teams = standings.teams || [], classes = standings.classes || [];

    if (view === "teams") {
      if (!teams.length) return main.append(el("p", "empty", "No teams yet."));
      main.append(roll(teams, "points", (t) => classLabel(t.cls)));
    }

    if (view === "classes") {
      if (!classes.length) return main.append(el("p", "empty", "No classes yet."));
      main.append(el("div", "colhead", "Pts/person"));
      main.append(roll(classes.map((c) => ({ ...c, name: classLabel(c.name) })), "avg"));
    }

    if (view === "by-class") {
      const withTeams = [...new Set(teams.map((t) => t.cls))].sort(classOrder);
      if (!withTeams.length) return main.append(el("p", "empty", "No teams yet."));
      const grid = el("div", "columns");
      grid.style.setProperty("--cols", Math.min(withTeams.length, 4));
      const most = Math.max(...withTeams.map((c) => teams.filter((t) => t.cls === c).length));
      for (const c of withTeams) {
        const col = el("section");
        const list = roll(teams.filter((t) => t.cls === c), "points");
        list.style.setProperty("--n", most);
        col.append(el("h2", null, classLabel(c)), list);
        grid.append(col);
      }
      main.append(grid);
    }
  }

  document.querySelectorAll("nav button").forEach((b) => {
    b.addEventListener("click", () => { view = b.dataset.view; history.replaceState(null, "", "#" + view); render(); });
    b.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const i = VIEWS.indexOf(view) + (e.key === "ArrowRight" ? 1 : -1);
      view = VIEWS[(i + VIEWS.length) % VIEWS.length];
      history.replaceState(null, "", "#" + view); render();
      document.querySelector(`nav [data-view="${view}"]`).focus();
    });
  });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS.includes(h)) { view = h; render(); } });

  async function load() {
    try {
      const r = await fetch(API_URL, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      const json = JSON.stringify({ c: data.classes, t: data.teams });
      if (json === lastJson) return;
      lastJson = json; standings = data; render();
    } catch {
      if (!standings) $("#board").replaceChildren(el("p", "empty", "The standings can’t be reached right now. Try again in a minute."));
    }
  }

  render();
  load();
  setInterval(() => { if (!document.hidden) load(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
